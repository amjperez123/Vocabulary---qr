<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary QR Dictionary</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.card {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 2px 12px #ccc;
}

h1 {
  font-size: 34px;
}

.word {
  font-size: 48px;
  font-weight: bold;
  margin: 20px 0;
}

button {
  padding: 12px 20px;
  border: 0;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

.definition {
  margin-top: 25px;
  font-size: 20px;
}

ul {
  text-align: left;
  columns: 2;
  max-width: 650px;
  margin: auto;
}

li {
  margin: 8px 0;
}

a {
  text-decoration: none;
  color: #1565c0;
}
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>

const words = [
"Traps",
"Conflict",
"Sad",
"Alter",
"Quickly",
"Big",
"Pair",
"Lucky",
"Authority",
"Mandatory",
"Fortunate",
"Shelter",
"Biology",
"Population",
"Pollution",
"Extinct",
"Summarize",
"Central Idea",
"Snares",
"Blocked",
"Wardrobes",
"Tired",
"Worried",
"Excited",
"Site",
"Vocal",
"Shiny",
"Dreaded",
"Dumbfounded",
"Frightened",
"Active",
"Severe",
"Happy",
"Angry",
"Brave",
"Calm",
"Clean",
"Clever",
"Danger",
"Empty",
"Famous",
"Friend",
"Honest",
"Kind",
"Large",
"Little",
"Strong",
"Useful",
"Answer",
"Begin",
"Choose",
"Common",
"Create",
"Different",
"Early",
"Enough",
"Important",
"Learn",
"Listen",
"Message",
"Notice",
"Protect",
"Remember",
"Simple",
"Travel",
"Understand",
"Arrange",
"Attempt",
"Benefit",
"Compare",
"Complete",
"Discover",
"Evidence",
"Frequent",
"Identify",
"Increase",
"Observe",
"Require",
"Accurate",
"Complex",
"Essential",
"Significant",
"Approach",
"Consequence",
"Demonstrate",
"Interpret",
"Phenomenon",
"Sustainable",
"Compassionate",
"Extraordinary",
"Unprecedented",
"Adapt",
"Analyze",
"Clarify",
"Cooperate",
"Describe",
"Determine",
"Efficient",
"Evaluate",
"Generate"
];

const params = new URLSearchParams(window.location.search);
const requested = params.get("word");

const word = words.find(
  w => w.toLowerCase() === (requested || "").toLowerCase()
);

function speak() {

  const text = word || "";

  const u = new SpeechSynthesisUtterance(text);

  u.lang = "en-US";
  u.rate = 0.85;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

const app = document.getElementById("app");

if (word) {

  document.title = word + " - Vocabulary QR Dictionary";

  app.innerHTML = `
    <h1>Vocabulary QR Dictionary</h1>

    <div class="word">${word}</div>

    <button onclick="speak()">
      🔊 Pronounce
    </button>

    <div class="definition">

      <p>
        <b>Word:</b> ${word}
      </p>

      <p>
        This QR code is specifically for
        <b>${word}</b>.
      </p>

    </div>
  `;

} else if (requested) {

  app.innerHTML = `
    <h1>Word Not Found</h1>

    <p>
      The requested word
      "<b>${requested}</b>"
      is not in the dictionary.
    </p>
  `;

} else {

  app.innerHTML = `
    <h1>Vocabulary QR Dictionary</h1>

    <p>Choose a word:</p>

    <ul>
      ${words.map(w =>
        `<li>
          <a href="?word=${encodeURIComponent(w)}">${w}</a>
        </li>`
      ).join("")}
    </ul>
  `;
}

</script>

</body>
</html>
