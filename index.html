
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary QR Dictionary</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 24px 16px;
  text-align: center;
  color: #222;
}

.card {
  max-width: 620px;
  margin: 20px auto;
  background: white;
  padding: 30px 22px;
  border-radius: 18px;
  box-shadow: 0 4px 18px rgba(0,0,0,.10);
}

h1 {
  color: #1d4ed8;
}

.word {
  font-size: 42px;
  font-weight: bold;
  margin: 20px 0;
  color: #111827;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px 22px;
  margin: 8px;
  font-size: 19px;
  cursor: pointer;
}

.listen {
  background: #dbeafe;
  color: #1e40af;
}

.practice {
  background: #dcfce7;
  color: #166534;
}

#status {
  min-height: 32px;
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
  line-height: 1.4;
}

#heard {
  margin-top: 12px;
  color: #4b5563;
  font-size: 17px;
}

.note {
  margin-top: 22px;
  font-size: 14px;
  color: #6b7280;
  line-height: 1.5;
}

button:disabled {
  opacity: .6;
  cursor: default;
}
</style>
</head>

<body>
<div class="card" id="app"></div>

<script>

const words = [
"Traps", "Conflict", "Sad", "Alter", "Quickly",
"Big", "Pair", "Lucky", "Authority", "Mandatory",
"Fortunate", "Shelter", "Biology", "Population",
"Pollution", "Extinct", "Summarize", "Central Idea",
"Snares", "Blocked", "Wardrobes", "Tired", "Worried",
"Excited", "Site", "Vocal", "Shiny", "Dreaded",
"Dumbfounded", "Frightened", "Active", "Severe",
"Happy", "Angry", "Brave", "Calm", "Clean",
"Clever", "Danger", "Empty", "Famous", "Friend",
"Honest", "Kind", "Large", "Little", "Strong",
"Useful", "Answer", "Begin", "Choose", "Common",
"Create", "Different", "Early", "Enough", "Important",
"Learn", "Listen", "Message", "Notice", "Protect",
"Remember", "Simple", "Travel", "Understand", "Arrange",
"Attempt", "Benefit", "Compare", "Complete", "Discover",
"Evidence", "Frequent", "Identify", "Increase", "Observe",
"Require", "Accurate", "Complex", "Essential",
"Significant", "Approach", "Consequence", "Demonstrate",
"Interpret", "Phenomenon", "Sustainable",
"Compassionate", "Extraordinary", "Unprecedented",
"Adapt", "Analyze", "Clarify", "Cooperate", "Describe",
"Determine", "Efficient", "Evaluate", "Generate"
];

function normalize(text) {
  return text.toLowerCase()
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("Your browser does not support pronunciation playback.");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 0.8;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);
}

const params = new URLSearchParams(location.search);
const requested = params.get("word");

const target = requested
  ? words.find(w => normalize(w) === normalize(requested))
  : null;

const app = document.getElementById("app");

if (!target) {

  app.innerHTML =
    "<h1>📚 Vocabulary QR Dictionary</h1>" +
    "<p>Scan a QR code to practice a word.</p><ul>" +
    words.map(w => "<li>" + w + "</li>").join("") +
    "</ul>";

} else {

  app.innerHTML = `
    <h1>📚 Vocabulary Practice</h1>

    <div class="word">${target}</div>

    <button class="listen" id="listenBtn">
      🔊 Listen
    </button>

    <button class="practice" id="practiceBtn">
      🎤 Practice
    </button>

    <div id="status">
      Tap Practice, then say the word clearly.
    </div>

    <div id="heard"></div>

    <div class="note">
      Listen first, then say the word clearly.
      Feedback appears automatically when your browser
      recognizes your speech. Tap Try Again to practice again.
    </div>
  `;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const practiceBtn =
    document.getElementById("practiceBtn");

  const status =
    document.getElementById("status");

  const heard =
    document.getElementById("heard");

  let recognition = null;
  let listening = false;
  let feedbackShown = false;

  document.getElementById("listenBtn").onclick =
    () => speak(target);

  if (!SpeechRecognition) {

    practiceBtn.disabled = true;

    status.textContent =
      "⚠️ Speech recognition is not supported. Please try Google Chrome.";

  } else {

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;

    recognition.onstart = () => {

      listening = true;
      feedbackShown = false;

      heard.textContent = "";

      status.textContent =
        "🎤 Listening... Say the word now.";

      practiceBtn.textContent =
        "🎤 Listening...";

      practiceBtn.disabled = true;
    };

    recognition.onresult = (event) => {

      let finalTranscript = "";
      let interimTranscript = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {

        const transcript = event.results[i][0].transcript;

        if (event.results[i].isFinal) {
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }

      const currentTranscript =
        finalTranscript || interimTranscript;

      if (currentTranscript) {
        heard.textContent =
          "👂 I heard: " + currentTranscript;
      }

      const expected = normalize(target);

      // Give early positive feedback when the
      // browser recognizes the complete target word.
      if (
        interimTranscript &&
        normalize(interimTranscript) === expected &&
        !feedbackShown
      ) {

        feedbackShown = true;

        status.textContent =
          "✅ Correct! Great job! 🎉";

        return;
      }

      // Check the final recognized result.
      if (finalTranscript && !feedbackShown) {

        feedbackShown = true;

        if (normalize(finalTranscript) === expected) {

          status.textContent =
            "✅ Correct! Great job! 🎉";

        } else {

          status.textContent =
            "❌ Not quite. Try again! Listen to the word and practice once more.";
        }
      }
    };

    recognition.onerror = (event) => {

      listening = false;

      practiceBtn.disabled = false;
      practiceBtn.textContent = "🎤 Try Again";

      if (
        event.error === "not-allowed" ||
        event.error === "permission-denied"
      ) {

        status.textContent =
          "⚠️ Please allow microphone access and try again.";

      } else if (event.error === "no-speech") {

        status.textContent =
          "🔇 I didn't hear anything. Please try again.";

      } else {

        status.textContent =
          "⚠️ Recognition problem. Please try again.";
      }
    };

    recognition.onend = () => {

      listening = false;

      practiceBtn.disabled = false;
      practiceBtn.textContent = "🎤 Try Again";

      if (!feedbackShown) {

        if (heard.textContent) {

          status.textContent =
            "❌ I couldn't clearly recognize the word. Try again!";

        } else {

          status.textContent =
            "🔇 No speech detected. Tap Try Again.";
        }
      }
    };

    practiceBtn.onclick = () => {

      if (listening || !recognition) return;

      status.textContent =
        "🎤 Starting microphone...";

      heard.textContent = "";

      try {

        recognition.start();

      } catch (error) {

        status.textContent =
          "⚠️ Please wait a moment, then try again.";
      }
    };
  }
}

</script>
</body>
</html>
